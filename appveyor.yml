version: 1.0.{build}
image: Visual Studio 2019

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APP_NAME: Antigravity
  APP_DOWNLOAD_URL: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe
  GH_TOKEN:
    secure: <mã_hóa_token_github>
  TELEGRAM_BOT_TOKEN:
    secure: <mã_hóa_bot_telegram>
  TELEGRAM_CHAT_ID:
    secure: <mã_hóa_chat_id>

cache:
  - C:\Users\appveyor\Downloads\AntigravitySetup.exe
  - C:\Tools\Antigravity\Antigravity.exe
  - C:\profile_path.txt
  - C:\AppProfile\*
  - C:\cache_backups\*
  - C:\RegistryBackup.reg

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  # ----- Bước 1: Cài TightVNC, noVNC, Cloudflared -----
  - ps: |
      Write-Host "=== CÀI ĐẶT MÔI TRƯỜNG ==="
      try {
        # TightVNC
        Write-Host "[1/4] Downloading & installing TightVNC..."
        Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile "tightvnc-setup.msi" -TimeoutSec 60
        Start-Process msiexec.exe -Wait -ArgumentList '/i tightvnc-setup.msi /quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=hieudz SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'
        Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -ErrorAction SilentlyContinue
        Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
        Start-Sleep 5
        Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden
        Start-Sleep 40

        netsh advfirewall firewall add rule name="Allow VNC 5900" dir=in action=allow protocol=TCP localport=5900
        netsh advfirewall firewall add rule name="Allow noVNC 6080" dir=in action=allow protocol=TCP localport=6080

        # noVNC
        Write-Host "[2/4] Installing Python & noVNC..."
        python -m pip install --upgrade pip
        pip install numpy novnc websockify==0.13.0
        Write-Host "  -> Dependencies ready"

        Write-Host "[3/4] Starting websockify (noVNC)..."
        $sitePackages = (pip show novnc | Select-String "Location:").Line -replace "Location:\s*", ""
        $novncWeb = Join-Path $sitePackages "novnc\web"
        Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", $novncWeb -WindowStyle Hidden
        Start-Sleep 10

        # Cloudflared
        Write-Host "[4/4] Downloading Cloudflared & starting tunnel..."
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe" -TimeoutSec 60
        Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:6080", "--logfile", "cloudflared.log", "--protocol", "http2" -WindowStyle Hidden

        # Chờ URL
        Write-Host "  -> Waiting for Cloudflared URL..."
        $cloudflaredUrl = $null
        for ($i = 1; $i -le 30; $i++) {
          Start-Sleep -Seconds 2
          if (Test-Path "cloudflared.log") {
            $logContent = Get-Content "cloudflared.log" -Raw -ErrorAction SilentlyContinue
            if ($logContent -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $cloudflaredUrl = $matches[0]
              break
            }
          }
          Write-Host "    Attempt $i/30..."
        }

        if ($cloudflaredUrl) {
          $env:CLOUDFLARED_URL = $cloudflaredUrl
          Write-Host "============================================"
          Write-Host " REMOTE VNC READY"
          Write-Host " URL: $cloudflaredUrl/vnc.html?password=hieudz"
          Write-Host " PASSWORD: hieudz"
          Write-Host "============================================"
        } else {
          Write-Host "ERROR: Cloudflared URL not found."
          exit 1
        }
      } catch {
        Write-Host "FATAL: Setup failed - $_"
        exit 1
      }

  # ----- Bước 2: Tải & cấu hình Antigravity -----
  - ps: |
      Write-Host "=== CHUẨN BỊ $env:APP_NAME ==="
      $AppName = $env:APP_NAME
      $AppDownloadUrl = $env:APP_DOWNLOAD_URL
      $ProfilePathFile = "C:\profile_path.txt"
      $BackupDir = "C:\cache_backups"
      $RegistryBackupFile = "C:\RegistryBackup.reg"
      $CacheProfileDir = "C:\AppProfile"

      function Backup-Profile {
        if (Test-Path $ProfilePathFile) {
          $source = (Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue).Trim()
          if ($source -and (Test-Path $source)) {
            $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
            $zipName = "profile_$timestamp.zip"
            New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null
            Compress-Archive -Path "$source\*" -DestinationPath "$BackupDir\$zipName" -Force
            Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
            Write-Host "Backup created: $zipName"
          }
        }
        reg export HKCU $RegistryBackupFile /y *>$null
      }

      function Restore-Profile {
        if (Test-Path $BackupDir) {
          $latestZip = Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestZip) {
            Write-Host "Restoring from $($latestZip.Name)..."
            $restoreTarget = if (Test-Path $ProfilePathFile) { (Get-Content $ProfilePathFile -Raw).Trim() } else { $null }
            if (-not $restoreTarget) {
              $restoreTarget = "$env:APPDATA\$AppName"
              $restoreTarget | Out-File -FilePath $ProfilePathFile -Encoding UTF8
            }
            New-Item -ItemType Directory -Force -Path $restoreTarget | Out-Null
            Expand-Archive -Path $latestZip.FullName -DestinationPath $restoreTarget -Force
            if (Test-Path $RegistryBackupFile) {
              reg import $RegistryBackupFile *>$null
            }
            return $true
          }
        }
        return $false
      }

      # Khôi phục hoặc cài mới
      if (-not (Restore-Profile)) {
        if (Test-Path $ProfilePathFile) {
          $cachedProfile = (Get-Content $ProfilePathFile -Raw).Trim()
          if (-not ($cachedProfile -and (Test-Path $cachedProfile))) {
            Remove-Item $ProfilePathFile -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Using cached profile folder (no zip backup)."
            # Gán biến để tránh cài lại
            $profileAlreadyExists = $true
          }
        }

        if (-not $profileAlreadyExists -and -not (Test-Path $ProfilePathFile)) {
          Write-Host "First run: downloading & installing $AppName..."

          # Tải file cài đặt
          $installerPath = "C:\Users\appveyor\Downloads\AntigravitySetup.exe"
          if (-not (Test-Path $installerPath)) {
            Write-Host "Downloading from: $AppDownloadUrl"
            Invoke-WebRequest -Uri $AppDownloadUrl -OutFile $installerPath -TimeoutSec 600
            $fileSize = (Get-Item $installerPath).Length
            if ($fileSize -lt 1MB) {
              Write-Host "WARNING: Downloaded file is very small ($fileSize bytes). The link might be broken."
            }
            Write-Host "Download complete ($fileSize bytes)."
          }

          # Nơi đặt exe thực thi
          $appFolder = "C:\Tools\$AppName"
          $appExe = "$appFolder\$AppName.exe"
          New-Item -ItemType Directory -Force -Path $appFolder | Out-Null

          # Thử cài đặt im lặng với nhiều tham số
          $installed = $false
          $silentArgSets = @(
            @("/silent", "/install"),
            @("/silent"),
            @("/S"),
            @("/quiet"),
            @("/verysilent")
          )
          foreach ($argSet in $silentArgSets) {
            try {
              Write-Host "Trying silent install with arguments: $($argSet -join ' ')"
              Start-Process $installerPath -ArgumentList $argSet -Wait -NoNewWindow -ErrorAction Stop
              Start-Sleep 5
              # Tìm file exe sau khi cài
              $searchPaths = @(
                "C:\Program Files\$AppName\$AppName.exe",
                "C:\Program Files (x86)\$AppName\$AppName.exe",
                "C:\Program Files\Google\$AppName\$AppName.exe",
                "$env:LOCALAPPDATA\$AppName\$AppName.exe",
                "$env:APPDATA\$AppName\$AppName.exe"
              )
              $found = $searchPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
              if ($found) {
                Copy-Item $found $appExe -Force
                $installed = $true
                Write-Host "Installation successful. Executable copied to $appExe"
                break
              }
            } catch {
              Write-Host "Attempt with $($argSet[0]) failed: $_"
            }
          }

          if (-not $installed) {
            Write-Host "No silent switch worked. Treating as portable app. Copying to $appExe..."
            Copy-Item $installerPath $appExe -Force
          }

          Write-Host "Application executable: $appExe"

          # Chạy lần đầu để tạo profile
          Write-Host "Launching $AppName to generate profile (please wait up to 60 seconds)..."
          $scanPaths = @("$env:APPDATA", "$env:LOCALAPPDATA", [Environment]::GetFolderPath("MyDocuments"))
          $beforeDirs = @()
          foreach ($path in $scanPaths) {
            if (Test-Path $path) {
              $beforeDirs += (Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
            }
          }

          Start-Process $appExe -WindowStyle Minimized

          # Đợi process xuất hiện
          $waitCount = 0
          while (-not (Get-Process $AppName -ErrorAction SilentlyContinue) -and $waitCount -lt 30) {
            Start-Sleep -Seconds 2
            $waitCount++
          }
          if (Get-Process $AppName -ErrorAction SilentlyContinue) {
            Write-Host "$AppName is running. Waiting 45 seconds for profile initialization..."
            Start-Sleep -Seconds 45
            Stop-Process -Name $AppName -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "Process did not appear. Waiting 60 seconds anyway..."
            Start-Sleep -Seconds 60
          }

          $afterDirs = @()
          foreach ($path in $scanPaths) {
            if (Test-Path $path) {
              $afterDirs += (Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
            }
          }
          $newDirs = $afterDirs | Where-Object { $_ -notin $beforeDirs }

          if ($newDirs) {
            $matched = $newDirs | Where-Object { $_ -like "*$AppName*" } | Select-Object -First 1
            $profileDir = if ($matched) { $matched } else { $newDirs | Select-Object -First 1 }
          } else {
            $profileDir = "$env:APPDATA\$AppName"
          }

          Write-Host "Detected profile folder: $profileDir"
          $profileDir | Out-File -FilePath $ProfilePathFile -Encoding UTF8
          Copy-Item "$profileDir\*" $CacheProfileDir -Recurse -Force -ErrorAction SilentlyContinue
          Backup-Profile
          Write-Host "ANTIGRAVITY FIRST RUN COMPLETE. PLEASE LOGIN VIA VNC NOW IF NOT ALREADY."
        }
      }

  # ----- Bước 3: Giám sát hệ thống -----
  - ps: |
      Write-Host "=== KHỞI ĐỘNG GIÁM SÁT ==="
      # Giám sát VNC
      Start-Job -ScriptBlock {
        while ($true) {
          if (-not (Get-Process "tvnserver" -ErrorAction SilentlyContinue)) {
            Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden
          }
          Start-Sleep -Seconds 120
        }
      } | Out-Null

      # Giám sát Antigravity
      $appExe = "C:\Tools\$env:APP_NAME\$env:APP_NAME.exe"
      Start-Job -ScriptBlock {
        param($exe, $name)
        while ($true) {
          if (-not (Get-Process $name -ErrorAction SilentlyContinue)) {
            if (Test-Path $exe) {
              Start-Process $exe -WindowStyle Minimized
            }
          }
          Start-Sleep -Seconds 60
        }
      } -ArgumentList $appExe, $env:APP_NAME | Out-Null

      # Backup định kỳ
      Start-Job -ScriptBlock {
        while ($true) {
          Start-Sleep -Seconds 300
          $ProfilePathFile = "C:\profile_path.txt"
          $BackupDir = "C:\cache_backups"
          $RegistryBackupFile = "C:\RegistryBackup.reg"
          if (Test-Path $ProfilePathFile) {
            $source = (Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue).Trim()
            if ($source -and (Test-Path $source)) {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              $zipName = "profile_$timestamp.zip"
              Compress-Archive -Path "$source\*" -DestinationPath "$BackupDir\$zipName" -Force
              Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
            }
          }
          reg export HKCU $RegistryBackupFile /y *>$null
        }
      } | Out-Null
      Write-Host "Health monitors started."

  # ----- Bước 4: Giữ session + Telegram + Auto restart -----
  - ps: |
      Write-Host "=== VPS SESSION STARTED ==="
      $cloudflaredUrl = $env:CLOUDFLARED_URL

      function Send-Telegram($msg) {
        if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
          try {
            $encoded = [uri]::EscapeDataString($msg)
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$env:TELEGRAM_CHAT_ID&text=$encoded" -Method Get -TimeoutSec 10 | Out-Null
          } catch {}
        }
      }

      Send-Telegram "✅ VPS đã sẵn sàng!%0A🔗 VNC: $cloudflaredUrl/vnc.html?password=hieudz%0A🔑 Pass: hieudz%0A⌨️ Lệnh: /status, /backup, /restart"

      $totalMinutes = 55
      $lastUpdateId = 0
      for ($i = 1; $i -le $totalMinutes; $i++) {
        $time = Get-Date -Format 'HH:mm:ss'
        Write-Host "🟢 Running minute $i/$totalMinutes ($time)"

        if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
          try {
            $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/getUpdates?offset=$($lastUpdateId+1)&timeout=5" -Method Get -TimeoutSec 10
            if ($updates.result.Count -gt 0) {
              foreach ($update in $updates.result) {
                $lastUpdateId = $update.update_id
                if ($update.message.chat.id -eq $env:TELEGRAM_CHAT_ID) {
                  switch -Wildcard ($update.message.text) {
                    '/status' { Send-Telegram "🟢 VPS đang chạy. Phút $i/$totalMinutes" }
                    '/backup' {
                      $source = (Get-Content "C:\profile_path.txt" -Raw).Trim()
                      if ($source -and (Test-Path $source)) {
                        Compress-Archive -Path "$source\*" -DestinationPath "C:\cache_backups\manual_$(Get-Date -Format 'yyyyMMdd_HHmmss').zip" -Force
                        Send-Telegram "✅ Backup thủ công hoàn tất."
                      } else { Send-Telegram "❌ Không tìm thấy profile." }
                    }
                    '/restart' {
                      Send-Telegram "⏳ Đang kích hoạt restart..."
                      if ($env:GH_TOKEN) {
                        $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
                        $body = @{ event_type = "appveyor-restart" } | ConvertTo-Json
                        Invoke-RestMethod -Uri "https://api.github.com/repos/$env:APPVEYOR_REPO_NAME/dispatches" -Method Post -Headers $headers -Body $body
                      }
                    }
                  }
                }
              }
            }
          } catch {}
        }

        if ($i -eq 50 -and $env:GH_TOKEN) {
          Write-Host "Triggering auto-restart..."
          try {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $body = @{ event_type = "appveyor-restart" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:APPVEYOR_REPO_NAME/dispatches" -Method Post -Headers $headers -Body $body
          } catch {}
        }

        Start-Sleep -Seconds 60
      }
      Write-Host "=== VPS SESSION COMPLETED ==="

build: off
test: off
