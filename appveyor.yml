version: 8.0.{build}
image: Visual Studio 2019

clone_depth: 1

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APPVEYOR_SAVE_CACHE_ON_ERROR: true
  FORCE_REINSTALL_CHROME: false

cache:
  - C:\Tools\Antigravity\Antigravity.exe
  - C:\Tools\VSCode\*
  - C:\ChromeProfile.7z
  - C:\Protect.7z
  - C:\RegistryBackup.reg
  - C:\ProgramData\npm-cache

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: |
      Write-Host "=== ANTIGRAVITY RDP v8.0 - TINH GỌN ==="
      $os = (Get-CimInstance Win32_OperatingSystem)
      $ramTotal = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
      $ramFree = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
      Write-Host "OS: $($os.Caption)"
      Write-Host "RAM: ${ramFree}GB free / ${ramTotal}GB total"

install:
  - ps: |
      Write-Host "=== KHÔI PHỤC DỮ LIỆU ==="

      # Chrome Profile
      if (Test-Path "C:\ChromeProfile.7z") {
        $chromeBase = "$env:LOCALAPPDATA\Google\Chrome"
        if (!(Test-Path $chromeBase)) { New-Item -ItemType Directory -Path $chromeBase -Force | Out-Null }
        & 7z x "C:\ChromeProfile.7z" -o"$chromeBase" -y | Out-Null
        Write-Host "  ✓ Chrome Profile restored"
      }

      # DPAPI Keys
      if (Test-Path "C:\Protect.7z") {
        & 7z x "C:\Protect.7z" -o"$env:APPDATA\Microsoft" -y | Out-Null
        Write-Host "  ✓ DPAPI Keys restored"
      }

      # Registry
      if (Test-Path "C:\RegistryBackup.reg") {
        reg import "C:\RegistryBackup.reg" *>$null
        Write-Host "  ✓ Registry restored"
      }

  - ps: |
      Write-Host "=== CÀI ĐẶT PHẦN MỀM ==="

      # Chrome
      $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
      if ($env:FORCE_REINSTALL_CHROME -eq "true" -or !(Test-Path $chromeExe)) {
        Write-Host "> Cài đặt Chrome..."
        Invoke-WebRequest -UseBasicParsing -Uri "https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe" -OutFile "C:\chrome_setup.exe"
        Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait
        Remove-Item "C:\chrome_setup.exe" -Force -ErrorAction SilentlyContinue
        Write-Host "  ✓ Chrome"
      } else { Write-Host "  ✓ Chrome đã có" }

      # Antigravity
      $appDir = "C:\Tools\Antigravity"
      $appExe = "$appDir\Antigravity.exe"
      if (!(Test-Path $appExe)) {
        New-Item -ItemType Directory -Path $appDir -Force | Out-Null
        Write-Host "> Tải Antigravity..."
        Invoke-WebRequest -UseBasicParsing -Uri "https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe" -OutFile $appExe
        Write-Host "  ✓ Antigravity"
      } else { Write-Host "  ✓ Antigravity đã có" }

      # VS Code Portable
      $vscodeDir = "C:\Tools\VSCode"
      $vscodeExe = "$vscodeDir\Code.exe"
      $vscodeData = "$vscodeDir\data"
      if (!(Test-Path $vscodeExe)) {
        Write-Host "> Tải VS Code..."
        New-Item -ItemType Directory -Path $vscodeDir -Force | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri "https://update.code.visualstudio.com/latest/win32-x64-archive/stable" -OutFile "C:\vscode.zip"
        Expand-Archive -Path "C:\vscode.zip" -DestinationPath $vscodeDir -Force
        Remove-Item "C:\vscode.zip" -Force
        New-Item -ItemType Directory -Path $vscodeData -Force | Out-Null
        Write-Host "  ✓ VS Code"
      } else { Write-Host "  ✓ VS Code đã có" }

      # Node.js 22
      $nodeExe = "C:\Program Files\nodejs\node.exe"
      if (!(Test-Path $nodeExe)) {
        Write-Host "> Cài đặt Node.js 22..."
        Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/v22.11.0/node-v22.11.0-x64.msi" -OutFile "C:\node_setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/i C:\node_setup.msi /quiet /norestart'
        Remove-Item "C:\node_setup.msi" -Force
        Write-Host "  ✓ Node.js"
      } else { Write-Host "  ✓ Node.js đã có" }

      # OpenClaw
      Write-Host "> Cài đặt OpenClaw..."
      npm install -g openclaw@latest
      Write-Host "  ✓ OpenClaw installed"

      # Cấu hình OpenClaw tự động
      Write-Host "> Cấu hình OpenClaw với DS2API..."
      openclaw onboard `
        --non-interactive `
        --install-daemon `
        --custom-provider-id ds2api `
        --custom-base-url "https://everything-kinda-tray-musical.trycloudflare.com/v1" `
        --custom-model-id "deepseek-v4-flash-nothinking" `
        --custom-api-key "sk-mykey" `
        --custom-compatibility openai
      Write-Host "  ✓ OpenClaw configured"

      # Đặt model mặc định
      $configPath = "$env:USERPROFILE\.openclaw\openclaw.json"
      if (Test-Path $configPath) {
        $config = Get-Content $configPath -Raw | ConvertFrom-Json
        if (-not $config.agents) { $config | Add-Member -MemberType NoteProperty -Name 'agents' -Value @{} -Force }
        if (-not $config.agents.defaults) { $config.agents | Add-Member -MemberType NoteProperty -Name 'defaults' -Value @{} -Force }
        if (-not $config.agents.defaults.model) { $config.agents.defaults | Add-Member -MemberType NoteProperty -Name 'model' -Value @{} -Force }
        $config.agents.defaults.model | Add-Member -MemberType NoteProperty -Name 'primary' -Value "ds2api/deepseek-v4-flash-nothinking" -Force
        $config | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8
        Write-Host "  ✓ OpenClaw default model set"
      }

      # Tạo shortcuts Desktop
      $WshShell = New-Object -comObject WScript.Shell
      $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity.lnk").TargetPath = $appExe
      $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Chrome.lnk").TargetPath = $chromeExe
      $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\VS Code.lnk").TargetPath = $vscodeExe
      Write-Host "  ✓ Shortcuts đã tạo"

build: off

test_script:
  - ps: |
      Write-Host "============================================"
      Write-Host "  RDP SẴN SÀNG - Pass: $env:APPVEYOR_RDP_PASSWORD"
      Write-Host "============================================"

      for ($i = 1; $i -le 360; $i++) {
        if ($i % 2 -eq 0) {
          # Chrome Profile
          $chromeSrc = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (Test-Path $chromeSrc) {
            & 7z a "C:\ChromeProfile.7z" "$chromeSrc\*" -y -mx=1 -xr!"Service Worker" -xr!"Code Cache" -xr!"GPUCache" | Out-Null
          }
          # DPAPI Keys
          if (Test-Path "$env:APPDATA\Microsoft\Protect") {
            & 7z a "C:\Protect.7z" "$env:APPDATA\Microsoft\Protect\*" -y -mx=1 | Out-Null
          }
          # Registry
          reg export HKCU "C:\RegistryBackup.reg" /y *>$null
        }
        if ($i % 10 -eq 0) {
          $ramNow = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session alive (Phút $i/360) | RAM Free: ${ramNow}GB"
        }
        Start-Sleep -Seconds 60
      }
