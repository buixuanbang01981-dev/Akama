version: 1.0.{build}
image: Visual Studio 2019

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APP_NAME: Antigravity
  APP_DOWNLOAD_URL: https://your-server.com/antigravity.exe   # <-- SỬA LINK
  CHROME_PORTABLE_URL: https://download2.portableapps.com/portableapps/GoogleChromePortable/GoogleChromePortable_117.0.5938.150_online.paf.exe
  # Token cho Telegram & auto-restart (tùy chọn)
  GH_TOKEN:
    secure: <mã_hóa_token_github>
  TELEGRAM_BOT_TOKEN:
    secure: <mã_hóa_bot_telegram>
  TELEGRAM_CHAT_ID:
    secure: <mã_hóa_chat_id>

# Cache nhiều thứ hơn, bao gồm cả file zip backup và registry export
cache:
  - C:\profile_path.txt
  - C:\AppProfile\*
  - C:\cache_backups\*       # Lưu các bản backup zip
  - C:\RegistryBackup.reg
  - C:\PortableApps\*

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  # ---- Bước 1: Môi trường VNC (giữ nguyên) ----
  - ps: |
      Write-Host "=== CÀI ĐẶT MÔI TRƯỜNG ==="
      try {
        # ... (dán script cài TightVNC, noVNC, Cloudflared từ bản chuẩn)
        # Kết quả: $cloudflaredUrl
      } catch {
        Write-Host "FATAL: Setup failed - $_"
        exit 1
      }

  # ---- Bước 2: Khôi phục & quản lý profile nâng cao ----
  - ps: |
      Write-Host "=== KHÔI PHỤC PROFILE NÂNG CAO ==="
      $AppName = $env:APP_NAME
      $AppDownloadUrl = $env:APP_DOWNLOAD_URL
      $CacheProfileDir = "C:\AppProfile"
      $ProfilePathFile = "C:\profile_path.txt"
      $BackupDir = "C:\cache_backups"
      $RegistryBackupFile = "C:\RegistryBackup.reg"

      # Hàm tạo backup zip
      function Backup-Profile {
        $source = Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue
        if ($source -and (Test-Path $source)) {
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $zipName = "profile_$timestamp.zip"
          New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null
          Compress-Archive -Path $source\* -DestinationPath "$BackupDir\$zipName" -Force
          # Giữ lại tối đa 5 bản backup
          Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
          Write-Host "Backup created: $zipName"
        }
        # Backup registry
        reg export HKCU $RegistryBackupFile /y *>$null
      }

      # Hàm khôi phục từ backup mới nhất
      function Restore-Profile {
        if (Test-Path $BackupDir) {
          $latestZip = Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestZip) {
            Write-Host "Restoring from $($latestZip.Name)..."
            $restoreTarget = Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue
            if (-not $restoreTarget) {
              # nếu không có file profile_path.txt (lần đầu?), tạo thư mục tạm
              $restoreTarget = "$env:APPDATA\$AppName"
              $restoreTarget | Out-File -FilePath $ProfilePathFile -Encoding UTF8
            }
            New-Item -ItemType Directory -Force -Path $restoreTarget | Out-Null
            Expand-Archive -Path $latestZip.FullName -DestinationPath $restoreTarget -Force
            Write-Host "Profile restored to $restoreTarget"
            # Import registry nếu có
            if (Test-Path $RegistryBackupFile) {
              reg import $RegistryBackupFile *>$null
              Write-Host "Registry imported."
            }
            return $true
          }
        }
        return $false
      }

      # Thử khôi phục từ backup zip trước, nếu không có thì dùng cache trực tiếp
      $restored = Restore-Profile
      if (-not $restored) {
        $realProfilePath = Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue
        if ($realProfilePath -and (Test-Path $realProfilePath)) {
          Write-Host "Using cached directory (no zip backup found)."
        } else {
          Write-Host "No profile found. First run."
          # Tải app nếu chưa có
          $appExe = "C:\$AppName.exe"
          if (-not (Test-Path $appExe)) {
            Write-Host "Downloading $AppName..."
            Invoke-WebRequest -Uri $AppDownloadUrl -OutFile $appExe -TimeoutSec 120
          }
          # Tự động phát hiện profile
          $scanPaths = @("$env:APPDATA", "$env:LOCALAPPDATA", [Environment]::GetFolderPath("MyDocuments"))
          $before = @()
          foreach ($path in $scanPaths) { if (Test-Path $path) { $before += (Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) } }
          Start-Process $appExe -WindowStyle Minimized
          Start-Sleep -Seconds 20
          $after = @()
          foreach ($path in $scanPaths) { if (Test-Path $path) { $after += (Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) } }
          $newDirs = $after | Where-Object { $_ -notin $before }
          $profileDir = if ($newDirs) { ($newDirs | Where-Object { $_ -like "*$AppName*" } | Select-Object -First 1) ?? ($newDirs | Select-Object -First 1) } else { "$env:APPDATA\$AppName" }
          Write-Host "Detected profile: $profileDir"
          $profileDir | Out-File -FilePath $ProfilePathFile -Encoding UTF8
          Stop-Process -Name $AppName -Force -ErrorAction SilentlyContinue
          # Copy vào cache directory
          New-Item -ItemType Directory -Force -Path $CacheProfileDir | Out-Null
          Copy-Item "$profileDir\*" $CacheProfileDir -Recurse -Force -ErrorAction SilentlyContinue
          # Tạo backup zip ngay lần đầu
          Backup-Profile
        }
      }

  # ---- Bước 3: Chrome Portable (như cũ, có thể thêm vào cache) ----
  - ps: |
      Write-Host "=== KIỂM TRA CHROME PORTABLE ==="
      if (-not (Test-Path "C:\PortableApps\Chrome\GoogleChromePortable.exe")) {
        Write-Host "Downloading Chrome Portable..."
        Invoke-WebRequest -Uri $env:CHROME_PORTABLE_URL -OutFile "chrome_install.exe"
        Start-Process -FilePath "chrome_install.exe" -ArgumentList "/destination=C:\PortableApps\Chrome" -Wait -NoNewWindow
        Write-Host "Chrome Portable installed."
      } else {
        Write-Host "Chrome Portable restored from cache."
      }
      # Khởi động Chrome Portable (ẩn)
      Start-Process "C:\PortableApps\Chrome\GoogleChromePortable.exe" -WindowStyle Minimized

  # ---- Bước 4: Health check & auto-healing background jobs ----
  - ps: |
      Write-Host "=== KHỞI ĐỘNG GIÁM SÁT HỆ THỐNG ==="
      # Hàm gửi Telegram
      function Send-Telegram($msg) {
        if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
          try {
            $encoded = [uri]::EscapeDataString($msg)
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$env:TELEGRAM_CHAT_ID&text=$encoded" -Method Get -TimeoutSec 10 | Out-Null
          } catch {}
        }
      }

      # Job 1: Health check VNC và Cloudflared mỗi 2 phút
      Start-Job -ScriptBlock {
        while ($true) {
          # Kiểm tra tiến trình tvnserver
          if (-not (Get-Process "tvnserver" -ErrorAction SilentlyContinue)) {
            Write-Host "VNC server down, restarting..."
            Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden
          }
          # Kiểm tra Cloudflared log vẫn đang ghi? Có thể ping thử tunnel
          # ... (triển khai thêm nếu cần)
          Start-Sleep -Seconds 120
        }
      } | Out-Null

      # Job 2: Giám sát app chính (Antigravity) - nếu không chạy thì khởi động lại
      $appName = $env:APP_NAME
      Start-Job -ScriptBlock {
        while ($true) {
          if (-not (Get-Process $appName -ErrorAction SilentlyContinue)) {
            Write-Host "$appName not running, restarting..."
            Start-Process "C:\$appName.exe" -WindowStyle Minimized
          }
          Start-Sleep -Seconds 60
        }
      } | Out-Null

      # Job 3: Backup định kỳ mỗi 5 phút (đã có trong vòng lặp chính, nhưng thêm background job để an toàn kép)
      Start-Job -ScriptBlock {
        while ($true) {
          Start-Sleep -Seconds 300  # 5 phút
          # Gọi hàm backup từ main script? Không được, phải code trực tiếp
          $ProfilePathFile = "C:\profile_path.txt"
          $BackupDir = "C:\cache_backups"
          $RegistryBackupFile = "C:\RegistryBackup.reg"
          $source = (Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue).Trim()
          if ($source -and (Test-Path $source)) {
            $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
            $zipName = "profile_$timestamp.zip"
            New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null
            Compress-Archive -Path $source\* -DestinationPath "$BackupDir\$zipName" -Force
            Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
          }
          reg export HKCU $RegistryBackupFile /y *>$null
        }
      } | Out-Null

      Write-Host "Health monitors started."

  # ---- Bước 5: Vòng lặp chính + Telegram command center ----
  - ps: |
      Write-Host "=== VPS SESSION STARTED ==="
      Send-Telegram "✅ VPS đã sẵn sàng!%0A VNC: $cloudflaredUrl/vnc.html?password=hieudz %0A Pass: hieudz %0A Lệnh: /status, /backup, /restart"
      $totalMinutes = 55
      $lastUpdateId = 0
      for ($i = 1; $i -le $totalMinutes; $i++) {
        $time = Get-Date -Format 'HH:mm:ss'
        Write-Host "🟢 Running minute $i/$totalMinutes ($time)"

        # Kiểm tra lệnh Telegram
        if ($env:TELEGRAM_BOT_TOKEN -and $env:TELEGRAM_CHAT_ID) {
          try {
            $updates = Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/getUpdates?offset=$($lastUpdateId+1)&timeout=5" -Method Get -TimeoutSec 10
            if ($updates.result.Count -gt 0) {
              foreach ($update in $updates.result) {
                $lastUpdateId = $update.update_id
                $text = $update.message.text
                if ($update.message.chat.id -eq $env:TELEGRAM_CHAT_ID) {
                  switch -Wildcard ($text) {
                    '/status' { Send-Telegram "🟢 VPS đang chạy. Phút thứ $i/$totalMinutes" }
                    '/backup' {
                      # Gọi backup ngay
                      $source = (Get-Content "C:\profile_path.txt" -Raw).Trim()
                      if ($source -and (Test-Path $source)) {
                        $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
                        Compress-Archive -Path $source\* -DestinationPath "C:\cache_backups\manual_$timestamp.zip" -Force
                        Send-Telegram "✅ Backup thủ công hoàn tất."
                      } else { Send-Telegram "❌ Không tìm thấy profile." }
                    }
                    '/restart' {
                      Send-Telegram "⏳ Kích hoạt restart..."
                      if ($env:GH_TOKEN) {
                        $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
                        $body = @{ event_type = "appveyor-restart" } | ConvertTo-Json
                        Invoke-RestMethod -Uri "https://api.github.com/repos/$env:APPVEYOR_REPO_NAME/dispatches" -Method Post -Headers $headers -Body $body
                      }
                    }
                  }
                }
              }
            }
          } catch {}
        }

        # Auto-restart
        if ($i -eq 50 -and $env:GH_TOKEN) {
          Write-Host "Triggering auto-restart..."
          try {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $body = @{ event_type = "appveyor-restart" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.github.com/repos/$env:APPVEYOR_REPO_NAME/dispatches" -Method Post -Headers $headers -Body $body
          } catch {}
        }

        Start-Sleep -Seconds 60
      }
      Write-Host "=== VPS SESSION COMPLETED ==="

build: off
test: off
