version: 1.0.{build}
image: Visual Studio 2019

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  - ps: |
      Write-Host "=== CÀI ĐẶT TIGHTVNC, NOVNC, CLOUDFLARED ==="
      try {
        # TightVNC
        Write-Host "[1/5] Downloading TightVNC..."
        Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile "tightvnc-setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/i tightvnc-setup.msi /quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=hieudz SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'
        Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -ErrorAction SilentlyContinue
        Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
        Start-Sleep 5
        Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden
        Start-Sleep 40

        netsh advfirewall firewall add rule name="Allow VNC 5900" dir=in action=allow protocol=TCP localport=5900
        netsh advfirewall firewall add rule name="Allow noVNC 6080" dir=in action=allow protocol=TCP localport=6080

        # noVNC
        Write-Host "[2/5] Installing Python deps..."
        python -m pip install --upgrade pip
        pip install numpy novnc websockify==0.13.0
        Write-Host "  -> Dependencies installed"

        Write-Host "[3/5] Downloading noVNC from GitHub..."
        $novncVersion = "v1.6.0"
        Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/tags/$novncVersion.zip" -OutFile "noVNC.zip"
        Expand-Archive -Path "noVNC.zip" -DestinationPath "." -Force
        Move-Item -Path "noVNC-$($novncVersion.Substring(1))" -Destination "noVNC" -Force
        $novncPath = "noVNC"

        Write-Host "[4/5] Starting websockify..."
        Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", "$novncPath" -WindowStyle Hidden
        Start-Sleep 15

        # Cloudflared
        Write-Host "[5/5] Downloading Cloudflared..."
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        Write-Host "  -> Starting tunnel..."
        Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:6080", "--logfile", "cloudflared.log" -WindowStyle Hidden

        # Chờ Cloudflared tạo file log và lấy URL (có retry)
        Write-Host "  -> Waiting for Cloudflared URL..."
        $cloudflaredUrl = $null
        for ($i = 1; $i -le 30; $i++) {
          Start-Sleep -Seconds 2
          if (Test-Path "cloudflared.log") {
            try {
              $logContent = Get-Content "cloudflared.log" -Raw -ErrorAction SilentlyContinue
              if ($logContent -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                $cloudflaredUrl = $matches[0]
                break
              }
            } catch {}
          }
          Write-Host "    Attempt $i/30..."
        }

        if ($cloudflaredUrl) {
          Write-Host "============================================"
          Write-Host " REMOTE VNC URL: $cloudflaredUrl/vnc.html"
          Write-Host " PASSWORD: hieudz"
          Write-Host "============================================"
        } else {
          Write-Host "ERROR: Could not retrieve Cloudflared URL."
          if (Test-Path "cloudflared.log") {
            Write-Host "Log content:"
            Get-Content "cloudflared.log" | Write-Host
          }
          exit 1
        }
      } catch {
        Write-Host "Setup failed: $_"
        exit 1
      }

  - ps: |
      Write-Host "=== VPS SESSION STARTED ==="
      $totalMinutes = 55
      for ($i = 1; $i -le $totalMinutes; $i++) {
        Write-Host "Running minute $i/$totalMinutes ($(Get-Date -Format 'HH:mm:ss'))"
        Start-Sleep -Seconds 60
      }
      Write-Host "=== VPS SESSION COMPLETED ==="

build: off
test: off
