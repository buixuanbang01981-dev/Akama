version: 1.0.{build}
image: Visual Studio 2019

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APP_NAME: Antigravity
  APP_DOWNLOAD_URL: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe
  GH_TOKEN:
    secure: <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>
  TELEGRAM_BOT_TOKEN:
    secure: <8446424800:AAGT3v7j1XIvUe6Q15DSA6F3Rl34iFOBM3E>
  TELEGRAM_CHAT_ID:
    secure: <7563947218>

cache:
  - C:\Tools\Antigravity\Antigravity.exe
  - C:\profile_path.txt
  - C:\AppProfile\*
  - C:\cache_backups\*
  - C:\RegistryBackup.reg

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  # ----- Bước 1: Cài TightVNC & noVNC & websockify (có kiểm tra port) -----
  - ps: |
      Write-Host "=== CÀI ĐẶT VNC SERVER ==="
      try {
        # TightVNC
        Write-Host "Installing TightVNC..."
        Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile "tightvnc-setup.msi" -TimeoutSec 60
        Start-Process msiexec.exe -Wait -ArgumentList '/i tightvnc-setup.msi /quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=hieudz SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'
        Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -ErrorAction SilentlyContinue
        Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
        Start-Sleep 5
        Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden
        
        # Chờ port 5900 sẵn sàng
        Write-Host "Waiting for VNC port 5900..."
        $ready = $false
        for ($i=1; $i -le 30; $i++) {
          if ((Test-NetConnection -ComputerName 127.0.0.1 -Port 5900 -WarningAction SilentlyContinue).TcpTestSucceeded) {
            $ready = $true
            break
          }
          Start-Sleep -Seconds 2
        }
        if (-not $ready) { throw "VNC port 5900 not ready" }
        Write-Host "VNC server ready."

        netsh advfirewall firewall add rule name="Allow VNC 5900" dir=in action=allow protocol=TCP localport=5900
        netsh advfirewall firewall add rule name="Allow noVNC 6080" dir=in action=allow protocol=TCP localport=6080

        # Python & noVNC & websockify
        Write-Host "Installing Python & noVNC..."
        python -m pip install --upgrade pip
        pip install numpy novnc websockify==0.13.0

        Write-Host "Starting websockify..."
        $sitePackages = (pip show novnc | Select-String "Location:").Line -replace "Location:\s*", ""
        $novncWeb = Join-Path $sitePackages "novnc\web"
        Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", $novncWeb -WindowStyle Hidden

        # Chờ port 6080 trả lời HTTP 200
        Write-Host "Waiting for noVNC port 6080..."
        $ready = $false
        for ($i=1; $i -le 30; $i++) {
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:6080/vnc.html" -TimeoutSec 3 -UseBasicParsing -ErrorAction Stop
            if ($response.StatusCode -eq 200) { $ready = $true; break }
          } catch {}
          Start-Sleep -Seconds 2
        }
        if (-not $ready) { throw "noVNC port 6080 not ready" }
        Write-Host "noVNC web server ready."

        # Cloudflared
        Write-Host "Starting Cloudflared tunnel..."
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe" -TimeoutSec 60
        Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:6080", "--logfile", "cloudflared.log", "--protocol", "http2" -WindowStyle Hidden

        # Chờ URL trycloudflare xuất hiện trong log
        Write-Host "Waiting for Cloudflared URL..."
        $cloudflaredUrl = $null
        for ($i=1; $i -le 60; $i++) {
          if (Test-Path "cloudflared.log") {
            $logContent = Get-Content "cloudflared.log" -Raw -ErrorAction SilentlyContinue
            if ($logContent -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $cloudflaredUrl = $matches[0]
              break
            }
          }
          Start-Sleep -Seconds 2
        }

        if ($cloudflaredUrl) {
          $env:CLOUDFLARED_URL = $cloudflaredUrl
          Write-Host "============================================"
          Write-Host " VNC READY (copy link below to phone)"
          Write-Host " URL: $cloudflaredUrl/vnc.html?password=hieudz"
          Write-Host " Password: hieudz"
          Write-Host "============================================"
        } else {
          throw "Cloudflared URL not found after 120s"
        }
      } catch {
        Write-Host "FATAL: Setup failed - $_"
        exit 1
      }

  # ----- Bước 2: Chuẩn bị Antigravity & Profile (giữ nguyên) -----
  - ps: |
      Write-Host "=== CHUẨN BỊ $env:APP_NAME ==="
      # ... dán nguyên script backup/restore/check Antigravity từ bản trước ...
      # (giữ nguyên phần này, không thay đổi)

  # ----- Bước 3: Giữ session + Telegram -----
  - ps: |
      Write-Host "=== VPS SESSION STARTED ==="
      # ... dán nguyên script vòng lặp 55 phút + Telegram ...
