version: 9.0.{build}
image: Visual Studio 2019

clone_depth: 1

# ============================================
# KHU VỰC CẤU HÌNH
# ============================================
environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APPVEYOR_SAVE_CACHE_ON_ERROR: true
  FORCE_REINSTALL_CHROME: false

  # URL tải phần mềm
  CHROME_DOWNLOAD_URL: https://dl.google.com/chrome/install/ChromeStandaloneSetup64.exe
  ANTIGRAVITY_DOWNLOAD_URL: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe
  VSCODE_DOWNLOAD_URL: https://update.code.visualstudio.com/latest/win32-x64-archive/stable
  NODEJS_DOWNLOAD_URL: https://nodejs.org/dist/v22.11.0/node-v22.11.0-x64.msi

  # OpenClaw Custom API
  CUSTOM_API_ENDPOINT: https://everything-kinda-tray-musical.trycloudflare.com/v1
  CUSTOM_API_KEY: sk-mykey
  CUSTOM_MODEL_ID: deepseek-v4-flash-nothinking
  CUSTOM_PROVIDER_ID: ds2api

  # Telegram Bot
  TELEGRAM_BOT_TOKEN: 8446424800:AAGT3v7j1XIvUe6Q15DSA6F3Rl34iFOBM3E
  TELEGRAM_CHAT_ID: 7563947218

# ============================================
# CACHE
# ============================================
cache:
  - C:\Tools\Antigravity\Antigravity.exe
  - C:\Tools\VSCode\*
  - C:\ChromeProfile.7z
  - C:\Protect.7z
  - C:\RegistryBackup.reg
  - C:\ProgramData\npm-cache
  - C:\Users\appveyor\.openclaw\openclaw.json
  - C:\Users\appveyor\.openclaw\.env

# ============================================
# INIT
# ============================================
init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: |
      Write-Host "=== ANTIGRAVITY RDP v9.0 - OPENCLAW + TELEGRAM ==="
      $os = (Get-CimInstance Win32_OperatingSystem)
      $ramTotal = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
      $ramFree = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
      Write-Host "OS: $($os.Caption)"
      Write-Host "RAM: ${ramFree}GB free / ${ramTotal}GB total"

# ============================================
# INSTALL
# ============================================
install:
  # --- Khôi phục dữ liệu ---
  - ps: |
      Write-Host "=== KHÔI PHỤC DỮ LIỆU ==="

      if (Test-Path "C:\ChromeProfile.7z") {
        $chromeBase = "$env:LOCALAPPDATA\Google\Chrome"
        if (!(Test-Path $chromeBase)) { New-Item -ItemType Directory -Path $chromeBase -Force | Out-Null }
        & 7z x "C:\ChromeProfile.7z" -o"$chromeBase" -y | Out-Null
        Write-Host "  ✓ Chrome Profile restored"
      }

      if (Test-Path "C:\Protect.7z") {
        & 7z x "C:\Protect.7z" -o"$env:APPDATA\Microsoft" -y | Out-Null
        Write-Host "  ✓ DPAPI Keys restored"
      }

      if (Test-Path "C:\RegistryBackup.reg") {
        reg import "C:\RegistryBackup.reg" *>$null
        Write-Host "  ✓ Registry restored"
      }

  # --- Cài đặt phần mềm ---
  - ps: |
      Write-Host "=== CÀI ĐẶT PHẦN MỀM ==="

      # Chrome
      $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
      if ($env:FORCE_REINSTALL_CHROME -eq "true" -or !(Test-Path $chromeExe)) {
        Write-Host "> Cài đặt Chrome..."
        Invoke-WebRequest -UseBasicParsing -Uri $env:CHROME_DOWNLOAD_URL -OutFile "C:\chrome_setup.exe"
        Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait
        Remove-Item "C:\chrome_setup.exe" -Force -ErrorAction SilentlyContinue
        Write-Host "  ✓ Chrome"
      } else { Write-Host "  ✓ Chrome đã có" }

      # Antigravity
      $appDir = "C:\Tools\Antigravity"
      $appExe = "$appDir\Antigravity.exe"
      if (!(Test-Path $appExe)) {
        New-Item -ItemType Directory -Path $appDir -Force | Out-Null
        Write-Host "> Tải Antigravity..."
        Invoke-WebRequest -UseBasicParsing -Uri $env:ANTIGRAVITY_DOWNLOAD_URL -OutFile $appExe -TimeoutSec 600
        Write-Host "  ✓ Antigravity"
      } else { Write-Host "  ✓ Antigravity đã có" }

      # VS Code Portable
      $vscodeDir = "C:\Tools\VSCode"
      $vscodeExe = "$vscodeDir\Code.exe"
      $vscodeData = "$vscodeDir\data"
      if (!(Test-Path $vscodeExe)) {
        Write-Host "> Tải VS Code..."
        New-Item -ItemType Directory -Path $vscodeDir -Force | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri $env:VSCODE_DOWNLOAD_URL -OutFile "C:\vscode.zip"
        Expand-Archive -Path "C:\vscode.zip" -DestinationPath $vscodeDir -Force
        Remove-Item "C:\vscode.zip" -Force
        New-Item -ItemType Directory -Path $vscodeData -Force | Out-Null
        Write-Host "  ✓ VS Code"
      } else { Write-Host "  ✓ VS Code đã có" }

      # Node.js 22
      $nodeExe = "C:\Program Files\nodejs\node.exe"
      if (!(Test-Path $nodeExe)) {
        Write-Host "> Cài đặt Node.js 22..."
        Invoke-WebRequest -UseBasicParsing -Uri $env:NODEJS_DOWNLOAD_URL -OutFile "C:\node_setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/i C:\node_setup.msi /quiet /norestart'
        Remove-Item "C:\node_setup.msi" -Force
        Write-Host "  ✓ Node.js"
      } else { Write-Host "  ✓ Node.js đã có" }

      # Refresh PATH
      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      # OpenClaw
      Write-Host "> Cài đặt OpenClaw..."
      npm install -g openclaw@latest
      Write-Host "  ✓ OpenClaw"

      # Cấu hình OpenClaw
      $configDir = "$env:USERPROFILE\.openclaw"
      if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force | Out-Null }

      # Nếu chưa có config (lần đầu), tạo config với custom provider + Telegram
      if (!(Test-Path "$configDir\openclaw.json")) {
        Write-Host "> Tạo config OpenClaw..."

        # 1. Onboard với custom provider
        openclaw onboard `
          --non-interactive `
          --custom-provider-id $env:CUSTOM_PROVIDER_ID `
          --custom-base-url $env:CUSTOM_API_ENDPOINT `
          --custom-model-id $env:CUSTOM_MODEL_ID `
          --custom-api-key $env:CUSTOM_API_KEY `
          --custom-compatibility openai `
          --yes
        Write-Host "  ✓ Custom provider configured"

        # 2. Bật Telegram channel
        openclaw config set channels.telegram.enabled true
        openclaw config set channels.telegram.botToken "$env:TELEGRAM_BOT_TOKEN"
        openclaw config set channels.telegram.dmPolicy "open"
        openclaw config set channels.telegram.allowFrom "[\"$env:TELEGRAM_CHAT_ID\"]"
        Write-Host "  ✓ Telegram channel configured"

        # 3. Đảm bảo plugin telegram được bật
        openclaw plugins enable telegram 2>$null
        Write-Host "  ✓ Telegram plugin enabled"
      } else {
        Write-Host "  ✓ OpenClaw config exists (from cache)"
      }

      # Tạo shortcuts Desktop
      $WshShell = New-Object -comObject WScript.Shell
      $sc1 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity.lnk")
      $sc1.TargetPath = $appExe
      $sc1.Save()

      $sc2 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Chrome.lnk")
      $sc2.TargetPath = $chromeExe
      $sc2.Save()

      $sc3 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\VS Code.lnk")
      $sc3.TargetPath = $vscodeExe
      $sc3.Save()

      Write-Host "  ✓ Shortcuts đã tạo"

build: off

# ============================================
# TEST SCRIPT – GIỮ SESSION + BACKUP + OPENCLAW GATEWAY
# ============================================
test_script:
  - ps: |
      Write-Host "============================================"
      Write-Host "  RDP SẴN SÀNG - Pass: $env:APPVEYOR_RDP_PASSWORD"
      Write-Host "============================================"

      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      # Khởi động OpenClaw Gateway (nền)
      Write-Host "> Khởi động OpenClaw Gateway..."
      Start-Process -FilePath "cmd" -ArgumentList "/c openclaw gateway --port 18789 --bind loopback --force 2>&1" -WindowStyle Hidden
      Start-Sleep -Seconds 8

      # Kiểm tra gateway
      $gw = openclaw status --json 2>$null
      if ($gw) {
        Write-Host "  ✓ Gateway running"
        # Gửi thông báo Telegram
        $msg = [uri]::EscapeDataString("🤖 OpenClaw Gateway đã sẵn sàng! Gõ `/help` hoặc chat với bot @your_bot để bắt đầu.")
        Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$env:TELEGRAM_CHAT_ID&text=$msg" -Method Get -TimeoutSec 10 | Out-Null
      } else {
        Write-Host "  ⚠ Gateway may have failed to start"
      }

      # Vòng lặp giữ session + backup
      for ($i = 1; $i -le 360; $i++) {
        if ($i % 2 -eq 0) {
          $chromeSrc = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (Test-Path $chromeSrc) {
            & 7z a "C:\ChromeProfile.7z" "$chromeSrc\*" -y -mx=1 -xr!"Service Worker" -xr!"Code Cache" -xr!"GPUCache" | Out-Null
          }

          if (Test-Path "$env:APPDATA\Microsoft\Protect") {
            & 7z a "C:\Protect.7z" "$env:APPDATA\Microsoft\Protect\*" -y -mx=1 | Out-Null
          }

          reg export HKCU "C:\RegistryBackup.reg" /y *>$null
        }

        if ($i % 10 -eq 0) {
          $ramNow = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
          Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Phút $i/360 | RAM Free: ${ramNow}GB"
        }

        Start-Sleep -Seconds 60
      }
