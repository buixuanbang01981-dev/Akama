  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))
  - ps: |
      function Print-Banner {
          Write-Host "==========================================================================" -ForegroundColor Cyan
          Write-Host "   █████╗ ██╗  ██╗ █████╗ ███╗   ███╗ █████╗    ██╗  ██╗██╗ ██████╗██╗  ██╗" -ForegroundColor Cyan
          Write-Host "  ██╔══██╗██║ ██╔╝██╔══██╗████╗ ████║██╔══██╗   ██║  ██║██║██╔════╝██║ ██╔╝" -ForegroundColor Cyan
          Write-Host "  ███████║█████╔╝ ███████║██╔████╔██║███████║   ███████║██║██║     █████╔╝ " -ForegroundColor Cyan
          Write-Host "  ██╔══██║██╔═██╗ ██╔══██║██║╚██╔╝██║██╔══██║   ██╔══██║██║██║     ██╔═██╗ " -ForegroundColor Cyan
          Write-Host "  ██║  ██║██║  ██╗██║  ██║██║ ╚═╝ ██║██║  ██║██╗██║  ██║██║╚██████╗██║  ██╗" -ForegroundColor Cyan
          Write-Host "  ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝╚═╝╚═╝  ╚═╝╚═╝ ╚═════╝╚═╝  ╚═╝" -ForegroundColor Cyan
          Write-Host "==========================================================================" -ForegroundColor Cyan
          Write-Host "                  ENTERPRISE AUTOMATION SYSTEM v10.0                      " -ForegroundColor Green
          Write-Host "==========================================================================" -ForegroundColor Cyan
      }

      Print-Banner

      $os = (Get-CimInstance Win32_OperatingSystem)
      $ramTotal = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
      $ramFree = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
      Write-Host "OS: $($os.Caption)" -ForegroundColor Yellow
      Write-Host "RAM: ${ramFree}GB free / ${ramTotal}GB total" -ForegroundColor Yellow
      Write-Host "CPU: $((Get-CimInstance Win32_Processor).Name)" -ForegroundColor Yellow

install:
  - ps: |
      $ErrorActionPreference = "Stop"

      function Write-Log ($message, $type="INFO") {
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $color = switch ($type) {
              "INFO" { "Cyan" }
              "SUCCESS" { "Green" }
              "WARNING" { "Yellow" }
              "ERROR" { "Red" }
              default { "White" }
          }
          Write-Host "[$timestamp] [$type] $message" -ForegroundColor $color
      }

      Write-Log "Bắt đầu tiến trình khôi phục dữ liệu từ cache (Self-healing)..." "INFO"

      # Khôi phục Chrome Profile
      if (Test-Path "C:\ChromeProfile.7z") {
        $chromeBase = "$env:LOCALAPPDATA\Google\Chrome"
        if (!(Test-Path $chromeBase)) { New-Item -ItemType Directory -Path $chromeBase -Force | Out-Null }
        & 7z x "C:\ChromeProfile.7z" -o"$chromeBase" -y | Out-Null
        Write-Log "Đã khôi phục Chrome Profile thành công." "SUCCESS"
      } else { Write-Log "Không tìm thấy bản sao lưu Chrome." "WARNING" }

      # Khôi phục Windows Protect (DPAPI)
      if (Test-Path "C:\Protect.7z") {
        & 7z x "C:\Protect.7z" -o"$env:APPDATA\Microsoft" -y | Out-Null
        Write-Log "Đã khôi phục DPAPI Keys thành công." "SUCCESS"
      } else { Write-Log "Không tìm thấy bản sao lưu DPAPI." "WARNING" }

      # Khôi phục Registry
      if (Test-Path "C:\RegistryBackup.reg") {
        reg import "C:\RegistryBackup.reg" *>$null
        Write-Log "Đã khôi phục Registry thành công." "SUCCESS"
      } else { Write-Log "Không tìm thấy bản sao lưu Registry." "WARNING" }

      Write-Log "Hoàn tất khôi phục hệ thống." "SUCCESS"
      Write-Host "================================================================"

      Write-Log "Bắt đầu tải và cài đặt các phụ thuộc hệ thống cốt lõi..." "INFO"

      # 1. Chrome Enterprise Installation
      $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
      if ($env:FORCE_REINSTALL_CHROME -eq "true" -or !(Test-Path $chromeExe)) {
        Write-Log "Đang tải Google Chrome..." "INFO"
        Invoke-WebRequest -UseBasicParsing -Uri $env:CHROME_DOWNLOAD_URL -OutFile "C:\chrome_setup.exe"
        Start-Process "C:\chrome_setup.exe" -ArgumentList "/silent /install" -Wait
        Remove-Item "C:\chrome_setup.exe" -Force -ErrorAction SilentlyContinue
        Write-Log "Cài đặt Chrome hoàn tất." "SUCCESS"
      } else { Write-Log "Google Chrome đã được cài đặt." "SUCCESS" }

      # 2. Antigravity Agent
      $appDir = "C:\Tools\Antigravity"
      $appExe = "$appDir\Antigravity.exe"
      if (!(Test-Path $appExe)) {
        New-Item -ItemType Directory -Path $appDir -Force | Out-Null
        Write-Log "Đang tải Antigravity..." "INFO"
        Invoke-WebRequest -UseBasicParsing -Uri $env:ANTIGRAVITY_DOWNLOAD_URL -OutFile $appExe -TimeoutSec 600
        Write-Log "Antigravity Agent tải hoàn tất." "SUCCESS"
      } else { Write-Log "Antigravity Agent đã tồn tại." "SUCCESS" }

      # 3. Visual Studio Code
      $vscodeDir = "C:\Tools\VSCode"
      $vscodeExe = "$vscodeDir\Code.exe"
      if (!(Test-Path $vscodeExe)) {
        Write-Log "Đang tải VS Code Portable..." "INFO"
        New-Item -ItemType Directory -Path $vscodeDir -Force | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri $env:VSCODE_DOWNLOAD_URL -OutFile "C:\vscode.zip"
        Expand-Archive -Path "C:\vscode.zip" -DestinationPath $vscodeDir -Force
        Remove-Item "C:\vscode.zip" -Force
        New-Item -ItemType Directory -Path "$vscodeDir\data" -Force | Out-Null
        Write-Log "VS Code đã cài đặt hoàn tất." "SUCCESS"
      } else { Write-Log "VS Code Portable đã tồn tại." "SUCCESS" }

      # 4. Node.js
      $nodeExe = "C:\Program Files\nodejs\node.exe"
      if (!(Test-Path $nodeExe)) {
        Write-Log "Đang tải Node.js (Core Runtime)..." "INFO"
        Invoke-WebRequest -UseBasicParsing -Uri $env:NODEJS_DOWNLOAD_URL -OutFile "C:\node_setup.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/i C:\node_setup.msi /quiet /norestart'
        Remove-Item "C:\node_setup.msi" -Force
        Write-Log "Node.js đã được thiết lập." "SUCCESS"
      } else { Write-Log "Node.js đã sẵn sàng." "SUCCESS" }

      # Cập nhật biến môi trường Path để nhận lệnh npm ngay lập tức
      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      # 5. OpenClaw Enterprise Automation
      Write-Log "Cài đặt OpenClaw Global..." "INFO"
      npm install -g openclaw@latest
      Write-Log "OpenClaw v2.x sẵn sàng hoạt động." "SUCCESS"

      # 6. 9router - Smart AI Proxy
      Write-Log "Cài đặt nền tảng 9router (High-Performance Proxy)..." "INFO"
      npm install -g 9router@latest
      Write-Log "9router đã được cấu hình toàn cầu." "SUCCESS"

      # 7. ds2api Installation
      Write-Log "Tải và thiết lập ds2api provider..." "INFO"
      $ds2apiDir = "C:\Tools\ds2api"
      if (!(Test-Path $ds2apiDir)) {
        New-Item -ItemType Directory -Path $ds2apiDir -Force | Out-Null
        $url = (Invoke-RestMethod https://api.github.com/repos/CJackHwang/ds2api/releases/latest).assets | Where-Object { $_.name -like '*windows_amd64.zip' } | Select-Object -ExpandProperty browser_download_url
        Invoke-WebRequest -Uri $url -OutFile "C:\ds2api.zip"
        Expand-Archive "C:\ds2api.zip" -DestinationPath $ds2apiDir -Force
        Remove-Item "C:\ds2api.zip" -Force
        Write-Log "ds2api đã sẵn sàng." "SUCCESS"
      } else { Write-Log "ds2api cache detected." "SUCCESS" }

      # Cấu hình ds2api
      $ds2apiConfig = @"
      {
        "keys": ["sk-mykey"],
        "accounts": [
          {
            "email": "buixuanbang01981@gmail.com",
            "password": "son22tq2011"
          }
        ]
      }
"@
      Set-Content -Path "$ds2apiDir\config.json" -Value $ds2apiConfig -Encoding UTF8
      Write-Log "Cấu hình tài khoản ds2api thành công." "SUCCESS"

      # Cấu hình OpenClaw
      Write-Log "Thiết lập cấu hình thông minh cho OpenClaw..." "INFO"
      $configDir = "$env:USERPROFILE\.openclaw"
      if (!(Test-Path $configDir)) { New-Item -ItemType Directory -Path $configDir -Force | Out-Null }

      if (!(Test-Path "$configDir\openclaw.json")) {
        Write-Log "Tạo OpenClaw Automation Settings..." "INFO"

        openclaw onboard `
          --non-interactive `
          --custom-provider-id $env:CUSTOM_PROVIDER_ID `
          --custom-base-url $env:CUSTOM_API_ENDPOINT `
          --custom-model-id $env:CUSTOM_MODEL_ID `
          --custom-api-key $env:CUSTOM_API_KEY `
          --custom-compatibility openai
        Write-Log "Custom AI Provider kết nối qua 9router/ds2api được ghi nhận." "SUCCESS"

        openclaw config set channels.telegram.enabled true
        openclaw config set channels.telegram.botToken "$env:TELEGRAM_BOT_TOKEN"
        openclaw config set channels.telegram.dmPolicy "open"
        Write-Log "Telegram Bot Protocol kích hoạt." "SUCCESS"

        openclaw plugins enable telegram 2>$null
        Write-Log "Telegram Plugin online." "SUCCESS"
      } else {
        Write-Log "Cấu hình OpenClaw đã load từ Cache." "SUCCESS"
      }

      # Tạo Desktop Shortcuts
      $WshShell = New-Object -comObject WScript.Shell
      $sc1 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Antigravity.lnk")
      $sc1.TargetPath = $appExe; $sc1.Save()
      $sc2 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\Chrome.lnk")
      $sc2.TargetPath = $chromeExe; $sc2.Save()
      $sc3 = $WshShell.CreateShortcut("$env:USERPROFILE\Desktop\VS Code.lnk")
      $sc3.TargetPath = $vscodeExe; $sc3.Save()
      Write-Log "Môi trường Workspace RDP sẵn sàng." "SUCCESS"

build: off

test_script:
  - ps: |
      $ErrorActionPreference = "Continue"

      function Write-Log ($message, $type="INFO") {
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $color = switch ($type) {
              "INFO" { "Cyan" }
              "SUCCESS" { "Green" }
              "WARNING" { "Yellow" }
              "ERROR" { "Red" }
              default { "White" }
          }
          Write-Host "[$timestamp] [$type] $message" -ForegroundColor $color
      }

      Write-Host "==========================================================================" -ForegroundColor Magenta
      Write-Host "                   🚀 RDP SECURE ACCESS ONLINE 🚀                           " -ForegroundColor White
      Write-Host "   Đăng nhập bằng mật khẩu: $env:APPVEYOR_RDP_PASSWORD" -ForegroundColor Yellow
      Write-Host "==========================================================================" -ForegroundColor Magenta

      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      # ---------------------------------------------------------------------------------
      # STAGE 1: TỰ ĐỘNG KHỞI ĐỘNG CÁC DỊCH VỤ NỀN TẢNG
      # ---------------------------------------------------------------------------------
      
      # 1. Start ds2api
      Write-Log "Khởi động ds2api Backend Server..." "INFO"
      Start-Process -FilePath "C:\Tools\ds2api\ds2api.exe" -WorkingDirectory "C:\Tools\ds2api" -WindowStyle Hidden
      Start-Sleep -Seconds 3

      # 2. Start 9router
      Write-Log "Khởi động 9router AI Mesh Proxy..." "INFO"
      Start-Process -FilePath "cmd" -ArgumentList "/c 9router start 2>&1" -WindowStyle Hidden
      Start-Sleep -Seconds 3

      # ---------------------------------------------------------------------------------
      # STAGE 2: HEALTH CHECKS VÀ TỰ ĐỘNG CHUẨN ĐOÁN (AUTO-DIAGNOSTICS)
      # ---------------------------------------------------------------------------------

      Write-Log "Thực hiện Health Check kết nối API..." "INFO"
      try {
        $testBody = @{
          model = $env:CUSTOM_MODEL_ID
          messages = @(@{role="user"; content="Xin chào hệ thống"})
        } | ConvertTo-Json -Depth 3
        $headers = @{ "Authorization" = "Bearer $($env:CUSTOM_API_KEY)" }
        $test = Invoke-RestMethod -Uri "$env:CUSTOM_API_ENDPOINT/chat/completions" -Method Post -Body $testBody -ContentType "application/json" -Headers $headers -TimeoutSec 15
        Write-Log "API Endpoint phản hồi: $($test.choices[0].message.content.Substring(0,[Math]::Min(80,$test.choices[0].message.content.Length)))..." "SUCCESS"
      } catch {
        Write-Log "Cảnh báo: API tạm thời không phản hồi. Lý do: $_" "WARNING"
      }

      # ---------------------------------------------------------------------------------
      # STAGE 3: KÍCH HOẠT OPENCLAW GATEWAY
      # ---------------------------------------------------------------------------------

      Write-Log "Khởi động OpenClaw Automation Gateway (Port 18789)..." "INFO"
      Start-Process -FilePath "cmd" -ArgumentList "/c openclaw gateway --port 18789 --bind loopback --force 2>&1" -WindowStyle Hidden
      Start-Sleep -Seconds 8

      # ---------------------------------------------------------------------------------
      # STAGE 4: CLOUDFLARE TUNNEL VÀ TELEGRAM NOTIFICATION (SIÊU TỰ ĐỘNG HÓA)
      # ---------------------------------------------------------------------------------

      Write-Log "Thiết lập đường hầm Cloudflare (Tự động đưa API ra Internet)..." "INFO"
      $cfDir = "C:\Tools\Cloudflare"
      if (!(Test-Path $cfDir)) { New-Item -ItemType Directory -Path $cfDir -Force | Out-Null }
      $cfExe = "$cfDir\cloudflared.exe"
      if (!(Test-Path $cfExe)) {
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cfExe
      }

      $cfLog = "$cfDir\tunnel.log"
      Start-Process -FilePath $cfExe -ArgumentList "tunnel --url http://127.0.0.1:8080" -RedirectStandardError $cfLog -WindowStyle Hidden
      Write-Log "Đang khởi tạo kết nối mạng toàn cầu..." "INFO"
      Start-Sleep -Seconds 10

      $cfUrl = "KHÔNG TÌM THẤY URL"
      if (Test-Path $cfLog) {
          $logContent = Get-Content $cfLog -Raw
          if ($logContent -match "(https://[a-zA-Z0-9-]+\.trycloudflare\.com)") {
              $cfUrl = $matches[1]
              Write-Log "Đã lấy được Public URL: $cfUrl" "SUCCESS"
          }
      }

      $botMsg = "🟢 [ENTERPRISE AUTOMATION] Hệ thống VPS đã vận hành 100% tự động!
      
      🚀 PUBLIC API ENDPOINT:
      👉 $cfUrl/v1
      
      🔑 API Key: sk-mykey
      🤖 Model: deepseek-v4-flash-nothinking
      
      🔧 Core Services:
      - 9router: ONLINE
      - ds2api: ONLINE (8080)
      - OpenClaw Gateway: ONLINE (18789)
      
      👤 Tài khoản cấu hình: buixuanbang01981@gmail.com
      Gõ /help để tương tác với Bot."
      
      $msgEncoded = [uri]::EscapeDataString($botMsg)
      Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage?chat_id=$env:TELEGRAM_CHAT_ID&text=$msgEncoded" -TimeoutSec 10 | Out-Null
      Write-Log "Đã tự động gửi Public API URL qua Telegram." "SUCCESS"


      # ---------------------------------------------------------------------------------
      # STAGE 5: VÒNG LẶP DOANH NGHIỆP - TỰ ĐỘNG BẢO TRÌ & GIÁM SÁT TRẠNG THÁI (360 CHU KỲ)
      # ---------------------------------------------------------------------------------

      Write-Log "Kích hoạt vòng lặp giám sát hệ thống (Thời gian chạy tối đa: 6 giờ)" "INFO"

      for ($i = 1; $i -le 360; $i++) {
        # 1. Auto Backup (2 phút / lần)
        if ($i % 2 -eq 0) {
          $chromeSrc = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (Test-Path $chromeSrc) {
            & 7z a "C:\ChromeProfile.7z" "$chromeSrc\*" -y -mx=1 -xr!"Service Worker" -xr!"Code Cache" -xr!"GPUCache" | Out-Null
          }
          if (Test-Path "$env:APPDATA\Microsoft\Protect") {
            & 7z a "C:\Protect.7z" "$env:APPDATA\Microsoft\Protect\*" -y -mx=1 | Out-Null
          }
          reg export HKCU "C:\RegistryBackup.reg" /y *>$null
        }

        # 2. System Metrics & Memory Management (10 phút / lần)
        if ($i % 10 -eq 0) {
          [System.GC]::Collect() # Giải phóng RAM thừa của powershell
          $ramNow = [math]::Round((Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB, 1)
          $cpuUsage = (Get-WmiObject win32_processor | Measure-Object -Property LoadPercentage -Average | Select-Object -ExpandProperty Average)
          Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] Giám sát hệ thống | Phút $i/360 | CPU: ${cpuUsage}% | RAM Free: ${ramNow}GB" -ForegroundColor Cyan
        }

        # 3. Process Auto-Healing (5 phút / lần)
        if ($i % 5 -eq 0) {
           $ds2apiProcess = Get-Process ds2api -ErrorAction SilentlyContinue
           if (!$ds2apiProcess) {
               Write-Log "[Auto-Heal] Phát hiện ds2api bị tắt, đang khởi động lại..." "WARNING"
               Start-Process -FilePath "C:\Tools\ds2api\ds2api.exe" -WorkingDirectory "C:\Tools\ds2api" -WindowStyle Hidden
           }
        }

        Start-Sleep -Seconds 60
      }

      Write-Log "Tiến trình tự động kết thúc vòng đời an toàn." "INFO"
