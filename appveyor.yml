version: 1.0.{build}
image: Visual Studio 2019

environment:
  APPVEYOR_RDP_PASSWORD: HieuDz@123456
  APP_NAME: Antigravity
  APP_DOWNLOAD_URL: https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.23.2-4781536860569600/windows-x64/Antigravity.exe
  # Bắt buộc lưu cache ngay cả khi build lỗi (đảm bảo dữ liệu không mất)
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

cache:
  - C:\Tools\Antigravity\Antigravity.exe
  - C:\profile_path.txt
  - C:\AppProfile\*
  - C:\cache_backups\*
  - C:\RegistryBackup.reg

init:
  - ps: iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

install:
  # ----- Bước 1: Chuẩn bị Antigravity & Profile -----
  - ps: |
      Write-Host "=== CHUẨN BỊ $env:APP_NAME ==="
      $AppName = $env:APP_NAME
      $ProfilePathFile = "C:\profile_path.txt"
      $BackupDir = "C:\cache_backups"
      $RegistryBackupFile = "C:\RegistryBackup.reg"
      $CacheProfileDir = "C:\AppProfile"
      $appExe = "C:\Tools\$AppName\$AppName.exe"
      
      # === QUAN TRỌNG: Luôn đảm bảo profile_path.txt tồn tại ===
      # Nếu file chưa có (lần đầu tiên, hoặc cache không khôi phục), tạo mới trỏ đến thư mục mặc định
      if (-not (Test-Path $ProfilePathFile)) {
        $defaultProfile = "$env:APPDATA\$AppName"
        Write-Host "Creating profile path file: $defaultProfile"
        $defaultProfile | Out-File -FilePath $ProfilePathFile -Encoding UTF8
      }

      function Backup-Profile {
        if (Test-Path $ProfilePathFile) {
          $source = (Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue).Trim()
          if ($source -and (Test-Path $source)) {
            $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
            $zipName = "profile_$timestamp.zip"
            New-Item -ItemType Directory -Force -Path $BackupDir | Out-Null
            Compress-Archive -Path "$source\*" -DestinationPath "$BackupDir\$zipName" -Force
            Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
            Write-Host "Backup created: $zipName"
          }
        }
        reg export HKCU $RegistryBackupFile /y *>$null
      }

      function Restore-Profile {
        if (Test-Path $BackupDir) {
          $latestZip = Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestZip) {
            Write-Host "Restoring profile from $($latestZip.Name)..."
            $restoreTarget = if (Test-Path $ProfilePathFile) { (Get-Content $ProfilePathFile -Raw).Trim() } else { $null }
            if (-not $restoreTarget) {
              $restoreTarget = "$env:APPDATA\$AppName"
              $restoreTarget | Out-File -FilePath $ProfilePathFile -Encoding UTF8
            }
            New-Item -ItemType Directory -Force -Path $restoreTarget | Out-Null
            Expand-Archive -Path $latestZip.FullName -DestinationPath $restoreTarget -Force
            if (Test-Path $RegistryBackupFile) {
              reg import $RegistryBackupFile *>$null
            }
            return $true
          }
        }
        return $false
      }

      # Thử khôi phục
      if (Restore-Profile) {
        Write-Host "✅ Profile restored."
      } else {
        Write-Host "ℹ️ No backup found. Will start fresh after you login and data is saved."
      }

      # Đảm bảo file Antigravity có sẵn
      if (-not (Test-Path $appExe)) {
        New-Item -ItemType Directory -Force -Path "C:\Tools\$AppName" | Out-Null
        Write-Host "Downloading $AppName from CDN..."
        Invoke-WebRequest -Uri $env:APP_DOWNLOAD_URL -OutFile $appExe -TimeoutSec 600
        Write-Host "Downloaded to $appExe"
      } else {
        Write-Host "✅ $AppName cached."
      }

      Write-Host "============================================"
      Write-Host " CONNECT VIA RDP (check log for IP:Port)"
      Write-Host " User: appveyor"
      Write-Host " Pass: $env:APPVEYOR_RDP_PASSWORD"
      Write-Host " THEN INSTALL/RUN ANTIGRAVITY & LOGIN"
      Write-Host "============================================"

  # ----- Bước 2: Giám sát & Backup định kỳ -----
  - ps: |
      Write-Host "=== STARTING BACKUP MONITOR ==="
      Start-Job -ScriptBlock {
        while ($true) {
          Start-Sleep -Seconds 300
          $ProfilePathFile = "C:\profile_path.txt"
          $BackupDir = "C:\cache_backups"
          $RegistryBackupFile = "C:\RegistryBackup.reg"
          if (Test-Path $ProfilePathFile) {
            $source = (Get-Content $ProfilePathFile -Raw -ErrorAction SilentlyContinue).Trim()
            if ($source -and (Test-Path $source)) {
              $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
              Compress-Archive -Path "$source\*" -DestinationPath "$BackupDir\profile_$timestamp.zip" -Force
              Get-ChildItem $BackupDir -Filter "profile_*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -Skip 5 | Remove-Item -Force
              Write-Host "Backup monitor: saved $source"
            }
          }
          reg export HKCU $RegistryBackupFile /y *>$null
        }
      } | Out-Null
      Write-Host "Backup monitor started (every 5 min)."

  # ----- Bước 3: Giữ session 55 phút -----
  - ps: |
      Write-Host "=== VPS SESSION STARTED (55 MINUTES) ==="
      $totalMinutes = 55
      for ($i = 1; $i -le $totalMinutes; $i++) {
        Write-Host "Running minute $i/$totalMinutes ($(Get-Date -Format 'HH:mm:ss'))"
        Start-Sleep -Seconds 60
      }
      Write-Host "=== VPS SESSION COMPLETED ==="

build: off
test: off
